
name: Build ANC-M Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Create ANC-M application
        shell: pwsh
        run: |
          @'
          import tkinter as tk
          from tkinter import filedialog, messagebox
          import cv2
          import numpy as np
          import threading
          import time
          import json
          from pathlib import Path

          VERSION = "0.2"

          def load_image(path):
              image = cv2.imread(path)
              if image is None:
                  raise ValueError("Cannot read image: " + path)
              return image

          def scene_cut(a, b):
              size = (160, 90)
              a = cv2.resize(a, size)
              b = cv2.resize(b, size)
              a = cv2.cvtColor(a, cv2.COLOR_BGR2HSV)
              b = cv2.cvtColor(b, cv2.COLOR_BGR2HSV)
              h1 = cv2.calcHist([a], [0, 1], None, [32, 32], [0, 180, 0, 256])
              h2 = cv2.calcHist([b], [0, 1], None, [32, 32], [0, 180, 0, 256])
              cv2.normalize(h1, h1)
              cv2.normalize(h2, h2)
              return cv2.compareHist(h1, h2, cv2.HISTCMP_BHATTACHARYYA) > 0.32

          def process(previous, current, threshold=7.0, confidence_limit=0.90):
              start = time.perf_counter()

              if previous.shape != current.shape:
                  raise ValueError("Both images must have identical dimensions.")

              if scene_cut(previous, current):
                  return current.copy(), {
                      "mode": "SCENE_CUT",
                      "reuse_fraction": 0.0,
                      "total_ms": (time.perf_counter() - start) * 1000
                  }

              p = cv2.cvtColor(previous, cv2.COLOR_BGR2GRAY)
              c = cv2.cvtColor(current, cv2.COLOR_BGR2GRAY)

              flow = cv2.calcOpticalFlowFarneback(
                  c, p, None, 0.5, 3, 21, 3, 5, 1.2, 0
              )

              h, w = c.shape
              x, y = np.meshgrid(
                  np.arange(w, dtype=np.float32),
                  np.arange(h, dtype=np.float32)
              )

              mx = x + flow[..., 0]
              my = y + flow[..., 1]

              valid = (
                  (mx >= 2) & (mx < w - 2) &
                  (my >= 2) & (my < h - 2)
              )

              warped = cv2.remap(
                  previous, mx, my, cv2.INTER_LINEAR,
                  borderMode=cv2.BORDER_CONSTANT
              )

              residual = np.mean(
                  np.abs(current.astype(np.float32) - warped.astype(np.float32)),
                  axis=2
              )

              confidence = np.exp(-residual / threshold)
              mask = valid & (confidence >= confidence_limit)

              output = current.copy()
              output[mask] = warped[mask]

              elapsed = (time.perf_counter() - start) * 1000

              return output, {
                  "mode": "TEMPORAL_REUSE",
                  "width": w,
                  "height": h,
                  "reuse_pixels": int(np.count_nonzero(mask)),
                  "total_pixels": int(h * w),
                  "reuse_fraction": float(np.mean(mask)),
                  "total_ms": elapsed,
                  "warning": "Reuse percentage is not an FPS improvement."
              }

          class ANCApp:
              def __init__(self, root):
                  self.root = root
                  root.title("ANC-M Desktop v" + VERSION)
                  root.geometry("700x530")
                  root.minsize(520, 420)
                  root.configure(bg="#10131b")

                  self.previous = ""
                  self.current = ""

                  tk.Label(
                      root, text="ANC-M",
                      font=("Segoe UI", 30, "bold"),
                      fg="white", bg="#10131b"
                  ).pack(pady=(22, 2))

                  tk.Label(
                      root, text="Adaptive Neural Computation",
                      fg="#9ca8bb", bg="#10131b"
                  ).pack(pady=(0, 22))

                  panel = tk.Frame(root, bg="#1a2030", padx=18, pady=18)
                  panel.pack(fill="x", padx=22)

                  self.previous_label = self.add_picker(
                      panel, "Previous frame", "previous"
                  )
                  self.current_label = self.add_picker(
                      panel, "Current frame", "current"
                  )

                  self.status = tk.StringVar(value="Ready")
                  tk.Label(
                      root, textvariable=self.status,
                      fg="#20c997", bg="#10131b",
                      font=("Segoe UI", 11)
                  ).pack(pady=15)

                  self.run_button = tk.Button(
                      root, text="PROCESS FRAMES",
                      command=self.start,
                      bg="#167d68", fg="white",
                      activebackground="#20a080",
                      font=("Segoe UI", 12, "bold"),
                      relief="flat", padx=25, pady=13
                  )
                  self.run_button.pack(pady=5)

                  self.output = tk.Text(
                      root, height=10, bg="#1a2030",
                      fg="#d5dbea", insertbackground="white",
                      relief="flat", padx=12, pady=12
                  )
                  self.output.pack(
                      fill="both", expand=True, padx=22, pady=18
                  )
                  self.output.insert(
                      "end",
                      "Select two images to begin.\n\n"
                      "ANC-M is an offline research prototype.\n"
                      "It does not currently boost game FPS."
                  )
                  self.output.config(state="disabled")

              def add_picker(self, parent, title, attr):
                  row = tk.Frame(parent, bg="#1a2030")
                  row.pack(fill="x", pady=9)

                  tk.Label(
                      row, text=title, width=17,
                      anchor="w", fg="white", bg="#1a2030"
                  ).pack(side="left")

                  label = tk.Label(
                      row, text="No image selected",
                      fg="#aab5c7", bg="#1a2030",
                      anchor="w"
                  )
                  label.pack(side="left", fill="x", expand=True)

                  tk.Button(
                      row, text="Browse",
                      command=lambda: self.pick(attr, label),
                      bg="#303b50", fg="white",
                      relief="flat", padx=12
                  ).pack(side="right")
                  return label

              def pick(self, attr, label):
                  path = filedialog.askopenfilename(
                      filetypes=[
                          ("Images", "*.png *.jpg *.jpeg *.bmp *.webp")
                      ]
                  )
                  if path:
                      setattr(self, attr, path)
                      label.config(text=Path(path).name)

              def show_report(self, text):
                  self.output.config(state="normal")
                  self.output.delete("1.0", "end")
                  self.output.insert("end", text)
                  self.output.config(state="disabled")

              def start(self):
                  if not self.previous or not self.current:
                      messagebox.showwarning(
                          "ANC-M", "Select both images first."
                      )
                      return

                  save_path = filedialog.asksaveasfilename(
                      defaultextension=".png",
                      initialfile="ANC-M-result.png",
                      filetypes=[("PNG image", "*.png")]
                  )
                  if not save_path:
                      return

                  self.run_button.config(state="disabled")
                  self.status.set("Processing...")
                  threading.Thread(
                      target=self.worker,
                      args=(save_path,),
                      daemon=True
                  ).start()

              def worker(self, save_path):
                  try:
                      a = load_image(self.previous)
                      b = load_image(self.current)
                      result, report = process(a, b)

                      if not cv2.imwrite(save_path, result):
                          raise RuntimeError("Could not save output image.")

                      report["output"] = save_path
                      report_path = str(
                          Path(save_path).with_name("ANC-M-report.json")
                      )
                      Path(report_path).write_text(
                          json.dumps(report, indent=2),
                          encoding="utf-8"
                      )

                      self.root.after(
                          0, lambda: self.done(report, report_path)
                      )
                  except Exception as e:
                      self.root.after(
                          0, lambda error=str(e): self.failed(error)
                      )

              def done(self, report, report_path):
                  self.run_button.config(state="normal")
                  self.status.set("Processing complete")
                  self.show_report(
                      json.dumps(report, indent=2) +
                      "\n\nReport saved to:\n" + report_path +
                      "\n\nReuse percentage is not an FPS measurement."
                  )
                  messagebox.showinfo("ANC-M", "Image saved successfully.")

              def failed(self, error):
                  self.run_button.config(state="normal")
                  self.status.set("Processing failed")
                  messagebox.showerror("ANC-M Error", error)

          if __name__ == "__main__":
              root = tk.Tk()
              ANCApp(root)
              root.mainloop()
          '@ | Set-Content -Encoding UTF8 main.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ANC-M main.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ANC-M-Windows
          path: dist/ANC-M.exe
          if-no-files-found: error
          retention-days: 30
          
